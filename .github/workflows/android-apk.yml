name: Android Engineering APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Expo Doctor
        run: pnpm exec expo-doctor

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build engineering debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare engineering artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="artifacts/AGNI-v0.2.0-engineering-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          APK_SHA256="$(cut -d ' ' -f 1 "$APK.sha256")"
          jq -n             --arg schema "qf.agni.android.engineering.v1"             --arg classification "ENGINEERING_DEBUG"             --arg package "com.quickfurno.agni"             --arg version "0.2.0"             --argjson versionCode 2             --arg sourceSha "$GITHUB_SHA"             --arg artifact "AGNI-v0.2.0-engineering-debug.apk"             --arg sha256 "$APK_SHA256"             '{schema:$schema,classification:$classification,package:$package,version:$version,versionCode:$versionCode,sourceSha:$sourceSha,artifact:$artifact,sha256:$sha256}'             > artifacts/engineering-manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AGNI-v0.2.0-engineering-debug
          path: |
            artifacts/AGNI-v0.2.0-engineering-debug.apk
            artifacts/AGNI-v0.2.0-engineering-debug.apk.sha256
            artifacts/engineering-manifest.json
          if-no-files-found: error
          retention-days: 14
